[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Cache-Control = "public, max-age=3600"

# Protección básica (opcional: añadir Basic Auth en Netlify UI)
# Para activar: Netlify Dashboard → Site → Access control → Basic Auth

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
