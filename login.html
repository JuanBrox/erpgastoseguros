<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Top Redes · Acceso</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐱</text></svg>">
<style>
:root {
  --amber:#C8641A; --amber-l:rgba(200,100,26,0.12); --amber-d:#9E4A0E;
  --dark:#1A1410; --mid:#5C4A3A; --light:#9E8B7A;
  --cream:#FAF7F3; --white:#fff; --rule:rgba(90,74,62,0.12);
  --green:#2D6A4F; --red:#B83232;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--dark);min-height:100vh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}

/* BG GRID */
.bg-grid{position:fixed;inset:0;opacity:0.04;background-image:linear-gradient(rgba(200,100,26,0.8) 1px,transparent 1px),linear-gradient(90deg,rgba(200,100,26,0.8) 1px,transparent 1px);background-size:44px 44px;pointer-events:none}

/* PANEL */
.login-panel{background:var(--white);border-radius:20px;width:100%;max-width:420px;padding:2.5rem;box-shadow:0 32px 80px rgba(0,0,0,0.4);position:relative;z-index:1}
.login-logo{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:900;color:var(--dark);text-align:center;margin-bottom:0.3rem}
.login-logo span{color:var(--amber)}
.login-sub{text-align:center;font-size:0.78rem;color:var(--light);margin-bottom:2rem}
.login-eyebrow{font-size:0.65rem;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;color:var(--amber);text-align:center;margin-bottom:1.5rem}

/* FORM */
.form-group{margin-bottom:1.1rem}
label{display:block;font-size:0.72rem;font-weight:600;text-transform:uppercase;letter-spacing:0.1em;color:var(--mid);margin-bottom:0.4rem}
input{width:100%;padding:0.75rem 1rem;border:1.5px solid var(--rule);border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.9rem;color:var(--dark);background:var(--cream);transition:border-color 0.15s,box-shadow 0.15s;outline:none}
input:focus{border-color:var(--amber);box-shadow:0 0 0 3px var(--amber-l);background:var(--white)}
.password-wrap{position:relative}
.password-wrap input{padding-right:2.8rem}
.toggle-pw{position:absolute;right:0.9rem;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;font-size:1rem;color:var(--light);transition:color 0.15s}
.toggle-pw:hover{color:var(--amber)}

.btn-login{width:100%;padding:0.85rem;background:var(--amber);color:var(--white);border:none;border-radius:10px;font-family:'DM Sans',sans-serif;font-size:0.95rem;font-weight:600;cursor:pointer;transition:all 0.2s;margin-top:0.5rem}
.btn-login:hover{background:var(--dark)}
.btn-login:active{transform:scale(0.98)}

/* ERROR */
.error-msg{background:rgba(184,50,50,0.1);color:var(--red);border:1px solid rgba(184,50,50,0.2);border-radius:8px;padding:0.65rem 1rem;font-size:0.82rem;text-align:center;margin-bottom:1rem;display:none}
.error-msg.show{display:block}

/* HINT */
.login-hint{text-align:center;font-size:0.72rem;color:var(--light);margin-top:1.5rem;border-top:1px solid var(--rule);padding-top:1rem}

/* LOADING */
.spinner{display:none;width:20px;height:20px;border:2px solid rgba(255,255,255,0.3);border-top-color:white;border-radius:50%;animation:spin 0.7s linear infinite;margin:0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="bg-grid"></div>
<div class="login-panel">
  <div class="login-eyebrow">Intranet corporativa</div>
  <div class="login-logo">Top<span>Redes</span></div>
  <div class="login-sub">Área privada · Solo personal autorizado</div>

  <div class="error-msg" id="error-msg">Usuario o contraseña incorrectos</div>

  <div class="form-group">
    <label>Usuario</label>
    <input type="text" id="username" placeholder="tu.usuario" autocomplete="username" autofocus>
  </div>
  <div class="form-group">
    <label>Contraseña</label>
    <div class="password-wrap">
      <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
      <button class="toggle-pw" type="button" onclick="togglePw()" id="pw-eye">👁</button>
    </div>
  </div>

  <button class="btn-login" onclick="doLogin()" id="btn-login">
    <span id="btn-text">Entrar</span>
    <div class="spinner" id="spinner"></div>
  </button>

  <div class="login-hint">¿Problemas de acceso? Contacta con el administrador</div>
</div>

<script>
// ─── BASE DE USUARIOS (modifica aquí) ───────────────────────────────────────
// páginas disponibles: informe, seo, erp, gantt, manual
const USERS = {
  "admin": {
    password: "topredes2026",
    name: "Administrador",
    role: "admin",
    pages: ["informe","seo","erp","gantt","manual"]  // acceso total
  },
  "juan": {
    password: "juan2026",
    name: "Juan",
    role: "gerente",
    pages: ["informe","seo","erp","gantt","manual"]
  },
  "tecnico1": {
    password: "tec2026",
    name: "Técnico 1",
    role: "instalador",
    pages: ["manual","gantt"]  // solo manual e instalaciones
  },
  "marketing": {
    password: "mkt2026",
    name: "Marketing",
    role: "marketing",
    pages: ["seo","informe"]  // solo SEO e informe
  }
};
// ────────────────────────────────────────────────────────────────────────────

function doLogin() {
  const user = document.getElementById('username').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const err  = document.getElementById('error-msg');

  err.classList.remove('show');
  document.getElementById('btn-text').style.display = 'none';
  document.getElementById('spinner').style.display = 'block';

  setTimeout(() => {
    if (USERS[user] && USERS[user].password === pass) {
      const u = USERS[user];
      sessionStorage.setItem('tr_user', JSON.stringify({
        username: user, name: u.name, role: u.role, pages: u.pages,
        ts: Date.now()
      }));
      window.location.href = 'index.html';
    } else {
      document.getElementById('btn-text').style.display = 'block';
      document.getElementById('spinner').style.display = 'none';
      err.classList.add('show');
      document.getElementById('password').value = '';
      document.getElementById('password').focus();
    }
  }, 600);
}

function togglePw() {
  const i = document.getElementById('password');
  i.type = i.type === 'password' ? 'text' : 'password';
  document.getElementById('pw-eye').textContent = i.type === 'password' ? '👁' : '🙈';
}

document.addEventListener('keydown', e => { if(e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
